KeepAlive Off

# Single worker: the chain needs the dangling session and the reclaim request
# to land on the same process.
<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Keep the lab reachable without an install wizard blocking everything
<FilesMatch "^(wp-config\.php|xmlrpc\.php)$">
    Require all granted
</FilesMatch>
