# Single-worker prefork. Loaded from conf-enabled/, after mods-enabled, so it
# overrides the distro mpm_prefork.conf defaults.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
